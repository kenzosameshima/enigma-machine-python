[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma-machine-python"
version = "0.2.0-alpha"
description = "A Python simulator for the Enigma machine."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "enigma-machine-python contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
enigma-machine = "enigma.cli:main"

[tool.setuptools.packages.find]
include = ["enigma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
packages = ["enigma"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
