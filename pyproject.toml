[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma-machine-python"
version = "0.2.2-alpha"
description = "A Python simulator for the Enigma machine."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "enigma-machine-python contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.8",
    "hypothesis>=6.100",
    "pytest-randomly>=3.15",
    "cosmic-ray==8.7.0",
]

[project.scripts]
enigma-machine = "enigma.cli:main"

[tool.setuptools.packages.find]
include = ["enigma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
markers = ["slow: exhaustive or long-running checks"]

[tool.coverage.run]
branch = true
source = ["enigma"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "C90", "PL", "RUF", "PT"]
ignore = ["PLR2004"] # magic-value noise from 26/3/4 in cipher code

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"enigma/**" = ["PT"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["enigma", "tests"]
strict = true
